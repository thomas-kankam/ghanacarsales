; Raise limits for car image uploads (base64 JSON payloads).
; Applies automatically with PHP-FPM when user_ini is enabled (common on shared hosts).
; Restart PHP-FPM / wait up to user_ini.cache_ttl after deploying.

upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 256M
max_execution_time = 120
max_input_time = 120
