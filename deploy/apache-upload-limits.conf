# DirectAdmin + Apache: fix 413 on /api/dealer/upload_car
#
# Your PHP Options (post_max_size / upload_max_filesize = 256M) are already fine.
# Base64 images in JSON are NOT file uploads to ModSecurity — they count as
# "request body with no files". DirectAdmin default:
#   SecRequestBodyNoFilesLimit 131072  (128 KB)  → Deny with code 413
#
# ---------------------------------------------------------------------------
# Option A (recommended, no root SSH): DirectAdmin Custom HTTPD Config
# ---------------------------------------------------------------------------
# 1. DirectAdmin → Admin or User Level → Custom HTTPD Configurations
#    (or Domain Setup → backend.omnicarsgh.com → Custom HTTPD Config)
# 2. Add INSIDE the |CUSTOM| / customization box for that domain:
#
# <IfModule mod_security2.c>
#     SecRequestBodyLimit 268435456
#     SecRequestBodyNoFilesLimit 268435456
#     SecRequestBodyInMemoryLimit 268435456
# </IfModule>
#
# 3. Save. DirectAdmin rewrites Apache config. Retry the upload.
#
# ---------------------------------------------------------------------------
# Option B (root SSH): persistent CustomBuild override
# ---------------------------------------------------------------------------
# mkdir -p /usr/local/directadmin/custombuild/custom/ap2/conf/extra
# cp -a /usr/local/directadmin/custombuild/configure/ap2/conf/extra/httpd-modsecurity.conf \
#       /usr/local/directadmin/custombuild/custom/ap2/conf/extra/httpd-modsecurity.conf
# # Edit SecRequestBodyLimit / SecRequestBodyNoFilesLimit to 268435456
# da build rewrite_confs
# systemctl restart httpd
#
# ---------------------------------------------------------------------------
# Confirm in Apache error log after a failed upload:
#   ModSecurity: Request body no files data length is larger than the configured limit
# ---------------------------------------------------------------------------
