# Apache: raise body / PHP limits for car image uploads
# (base64 JSON payloads — multiple JPGs easily exceed default PHP post_max_size)
#
# Option A — VirtualHost / Directory (preferred on VPS):
#
# <VirtualHost *:443>
#     ServerName backend.omnicarsgh.com
#     DocumentRoot /path/to/ghanacarsales
#
#     <Directory /path/to/ghanacarsales>
#         AllowOverride All
#         Require all granted
#         # 64 MiB (optional; Apache default is unlimited)
#         LimitRequestBody 67108864
#     </Directory>
# </VirtualHost>
#
# Then: sudo apachectl configtest && sudo systemctl reload apache2
#   (or: sudo systemctl reload httpd)
#
# Option B — App root .htaccess (already in repo): LimitRequestBody + php_value
# Option C — App root .user.ini (already in repo): for Apache + PHP-FPM
#
# Always set PHP as well (php.ini, MultiPHP INI Editor, or .user.ini):
#   upload_max_filesize = 64M
#   post_max_size = 64M
#   memory_limit = 256M
#
# Then restart PHP-FPM / Apache so Laravel ValidatePostSize sees the new limit.
